name: Deploy Sonic Universe to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outputs/**'
      - 'companion/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install local music companion
        working-directory: companion
        run: npm ci --no-audit --no-fund
      - name: Check runtime scripts
        run: |
          node --check outputs/music-motion.js
          node --check outputs/film-story.js
          node --check outputs/project-pack.js
          node --check outputs/visual-presets.js
          node --check outputs/visual-system.js
          node --check outputs/flight-core.js
          node --check outputs/flight.js
          node --check outputs/online-music.js
          node --check companion/server.cjs
          node --check companion/providers/qishui.cjs
      - name: Run full test suite
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artwork
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
