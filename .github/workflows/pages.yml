name: Deploy Sonic Universe to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outputs/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify music response and optional flight
        run: |
          node tests/music-motion.test.cjs
          node --check outputs/music-motion.js
          node tests/flight-core.test.cjs
          node --check outputs/flight-core.js
          node --check outputs/flight.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artwork
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
