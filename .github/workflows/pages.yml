name: Deploy Sonic Universe to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outputs/**'
      - 'folia-mod/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify music response and optional flight
        run: |
          node tests/music-motion.test.cjs
          node --check outputs/music-motion.js
          node tests/flight-core.test.cjs
          node --test tests/project-pack.test.cjs
          node --test tests/visual-presets.test.cjs
          node --test tests/visual-system.test.cjs
          node --check outputs/project-pack.js
          node --check outputs/visual-presets.js
          node --check outputs/visual-system.js
          node --check outputs/flight-core.js
          node --check outputs/flight.js
          node --check folia-mod/sonic-universe/client.mjs
          node --check folia-mod/sonic-universe/src/analysis.mjs
          node --check folia-mod/sonic-universe/src/palette.mjs
          node --check folia-mod/sonic-universe/src/random.mjs
          node --check folia-mod/sonic-universe/src/renderer.mjs
          node tests/folia-sonic-universe.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artwork
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
