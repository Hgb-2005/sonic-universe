name: Build Sonic Universe for Windows

on:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Require a valid Windows publisher signature
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/stamp-assets.cjs --check
      - name: Build Windows test installer
        if: ${{ !inputs.sign_windows }}
        run: npm run desktop:build
      - name: Build and verify Windows publisher signature
        if: ${{ inputs.sign_windows }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SONIC_WINDOWS_PUBLISHER: ${{ vars.SONIC_WINDOWS_PUBLISHER }}
        run: npm run desktop:build:signed
      - name: Verify packaged wallpaper quarantine
        run: node scripts/desktop-smoke.cjs --packaged --quarantine-only
      - name: Verify packaged desktop recovery
        run: node scripts/desktop-lifecycle-smoke.cjs --packaged
      - name: Verify packaged online playback
        run: node scripts/music-upgrade-smoke.cjs --packaged
      - name: Verify packaged library search
        run: node scripts/library-search-smoke.cjs --packaged
      - name: Verify packaged lyrics
        run: node scripts/now-playing-smoke.cjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-universe-windows-x64
          path: release/Sonic-Universe-*-x64.exe
          if-no-files-found: error
