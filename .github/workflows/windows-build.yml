name: Build Sonic Universe for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/stamp-assets.cjs --check
      - run: npm run desktop:build
      - name: Verify packaged wallpaper quarantine
        run: node scripts/desktop-smoke.cjs --packaged --quarantine-only
      - name: Verify packaged desktop recovery
        run: node scripts/desktop-lifecycle-smoke.cjs --packaged
      - name: Verify packaged playback queue
        run: node scripts/queue-smoke.cjs --packaged
      - name: Verify packaged online playback
        run: node scripts/music-upgrade-smoke.cjs --packaged
      - name: Verify packaged library search
        run: node scripts/library-search-smoke.cjs --packaged
      - name: Verify packaged lyrics
        run: node scripts/now-playing-smoke.cjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-universe-windows-x64
          path: release/Sonic-Universe-*-x64.exe
          if-no-files-found: error
