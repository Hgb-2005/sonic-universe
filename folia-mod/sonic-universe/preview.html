<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声波宇宙 · Folia 背景预览</title>
  <style>
    html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030510; }
    #stage { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const scene = params.get('scene') || 'ring';
    let definition;
    globalThis.folium = {
      registries: {
        backgrounds: {
          register(next) {
            definition = next;
            return { id: next.id, unregister() {} };
          },
        },
      },
    };
    const module = await import('./client.mjs');
    module.default(globalThis.folium);

    const bands = { bass: 0, lowMid: 0, mid: 0, vocal: 0, treble: 0 };
    const spectrum = new Uint8Array(1024);
    const audio = {
      getPower() {
        return 0.52 + Math.sin(performance.now() * 0.0013) * 0.24;
      },
      getBands() {
        const now = performance.now() * 0.001;
        bands.bass = 0.5 + Math.sin(now * 1.55) * 0.34;
        bands.lowMid = 0.44 + Math.sin(now * 0.91 + 1) * 0.21;
        bands.mid = 0.42 + Math.sin(now * 0.67 + 2) * 0.18;
        bands.vocal = 0.35 + Math.sin(now * 0.83 + 3.2) * 0.2;
        bands.treble = 0.25 + Math.sin(now * 1.7 + 4.6) * 0.17;
        return bands;
      },
      getSpectrum() {
        const now = performance.now() * 0.001;
        for (let index = 0; index < spectrum.length; index += 1) {
          const voice = Math.exp(-Math.pow((index - 92 - Math.sin(now * 0.7) * 22) / 28, 2));
          const air = Math.exp(-Math.pow((index - 340 - Math.cos(now * 0.33) * 80) / 120, 2));
          const ripple = 0.18 + 0.18 * Math.sin(index * 0.095 + now * 2.1);
          spectrum[index] = Math.max(0, Math.min(255, (voice * 0.8 + air * 0.5 + ripple * (1 - index / 1024)) * 255));
        }
        return spectrum;
      },
    };

    const stage = document.querySelector('#stage');
    const listeners = new Set();
    const resizeListeners = new Set();
    let frameHandle = 0;
    let resizeObserver;
    const tick = (timestamp) => {
      for (const listener of frameListeners) listener(timestamp);
      frameHandle = requestAnimationFrame(tick);
    };
    const frameListeners = new Set();
    const context = {
      staticMode: params.get('static') === '1',
      isPaused: () => params.get('paused') === '1',
      getTheme: () => ({
        name: 'sonic-universe',
        backgroundColor: '#050817',
        primaryColor: '#765bda',
        accentColor: '#c399ff',
        secondaryColor: '#3668d1',
        isDaylight: false,
      }),
      getSettings: () => ({
        scene,
        density: Number(params.get('density') || 72),
        motion: 100,
        sensitivity: 1,
        glow: 66,
        depth: 76,
        highDynamic: true,
      }),
      getCoverUrl: () => null,
      audio,
      onChange(listener) {
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
      onFrame(listener) {
        if (!frameHandle) frameHandle = requestAnimationFrame(tick);
        frameListeners.add(listener);
        return () => frameListeners.delete(listener);
      },
      onResize(listener) {
        resizeListeners.add(listener);
        listener({ width: stage.clientWidth, height: stage.clientHeight });
        return () => resizeListeners.delete(listener);
      },
      every() {
        return () => {};
      },
      onDispose() {},
    };

    resizeObserver = new ResizeObserver(() => {
      for (const listener of resizeListeners) {
        listener({ width: stage.clientWidth, height: stage.clientHeight });
      }
    });
    resizeObserver.observe(stage);
    definition.mount(stage, context);
  </script>
</body>
</html>
